# =====================================================================
# 用途：双修功法 / 掷骰档 / 四榜（M7 L7）
# 后台域：dual_cultivation（balance）
# =====================================================================

# 邀约过期秒
invite_expire_sec: 300
# 确认后可重掷次数（不含首次）
max_rerolls: 1
# 开局消耗灵石（邀请方）
spirit_stone_cost: 10
# 上榜最低分（未达不占榜）
rank_min_scores:
  number_one: 1
  zero: 1

# 四榜展示名（机读键 → 中文）
rank_labels:
  male_number_one: 男修一号榜
  male_zero: 男修零号榜
  female_number_one: 女修一号榜
  female_zero: 女修零号榜

# 掷骰出目 → 效果档 + 时长/倍率（须覆盖 dice 区间）
dice_tiers:
  - { min_roll: 1, max_roll: 4, effect_tier: low, yield_mult: 0.8, duration_sec: 20, label_zh: 浅缘 }
  - { min_roll: 5, max_roll: 8, effect_tier: mid, yield_mult: 1.0, duration_sec: 40, label_zh: 合契 }
  - { min_roll: 9, max_roll: 20, effect_tier: high, yield_mult: 1.3, duration_sec: 60, label_zh: 天成 }

# 双修功法（与战斗功法解耦）
techniques:
  twin_moon_mutual:
    label: 双月同修
    mode: mutual_gain
    require_opposite_gender: false
    realm_min: body_tempering
    cooldown_sec: 30
    base_yield: 50
    # 一号榜贡献分（双方各加）
    number_one_score: 10
    # 零号榜风姿分（mutual 双方各加）
    zero_score: 5
  jade_dew_transfer:
    label: 玉露传功
    mode: transfer
    # inviter_to_invitee | invitee_to_inviter
    transfer_direction: inviter_to_invitee
    require_opposite_gender: false
    realm_min: body_tempering
    cooldown_sec: 30
    base_yield: 40
    # 传方扣修为池（不足则拒）
    transfer_cost_from_giver: 20
    # 传方耗灵石（可选）
    giver_spirit_stone_cost: 5
    number_one_score: 8
    # 仅受方计零号榜
    zero_score_receiver: 12
    zero_score_giver: 0
