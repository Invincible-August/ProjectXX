# =====================================================================
# 用途：角色在线状态（Presence）— WS 鉴权连接为权威
# 后台域：可挂 chat / 系统；细则见《玩家在线状态设计.md》
# =====================================================================

# 最后一条 WS 断开后仍视为在线的秒数（扛刷新/弱网）；0=立即离线并推送
grace_sec: 30

# 仅 development：全局假定在线（默认 false，避免误伤化身助战「离线自动借入」）
dev_assume_online: false

# 可选：按用途覆盖 DEV 假定；缺省则回落各业务 YAML 遗留键
# party / face / friends / assist / contest
dev_assume_by_purpose: {}
