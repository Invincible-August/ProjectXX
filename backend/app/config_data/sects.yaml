shop_items:
  contrib_stone_pack:
    label_zh: 贡献灵石包
    summary: 用宗门贡献兑换少量灵石（占位）
    cost_contribution: 100
    reward_spirit_stones: 200
    require_feature: shop_basic
  contrib_quest_token:
    label_zh: 任务加速符（占位）
    summary: 占位道具；仅记流水，不进真背包键亦可
    cost_contribution: 50
    reward_spirit_stones: 0
    require_feature: shop_basic

# 宗门任务样本（含化身可独立接交 · M4-D06）
quests:
  daily_patrol:
    label_zh: 宗门巡山
    summary: 本体或化身均可接；完成后获贡献
    assignee_modes: [body, avatar]
    reward_contribution: 30
    require_feature: quests_basic
  avatar_herb_gather:
    label_zh: 化身采药
    summary: 仅化身可接；失败不牵连本体陨落
    assignee_modes: [avatar]
    reward_contribution: 45
    require_feature: quests_basic

# 旧模板占位（设施预览/兼容；正式玩法以 npc_sects 为准）
sects:
  placeholder_spirit_beast:
    name: 灵兽宗（占位）
    facilities: [spirit_beast_sect]
    summary: 改灵宠词条类型；玩法已开，配置契约保留
