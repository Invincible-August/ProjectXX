# =====================================================================
# 用途：宗门玩法（M7 L1 + M7-V+ 深化）+ 全站设施开关
# 加载时机：SectService / SectOrgService / SectFacilityService / 设施预览
# 后台域：sects（facility 风险）；须双写可配（§0.0 / §0.0.1）
# =====================================================================

# 设施总闸：后台改 enabled 发布后玩家服预览即时反映
facilities:
  # —— 字段说明 ——
  # enabled   是否对玩家开放入口（false 时 API 返回未开放）
  # note      玩家可见说明（§0.7）
  spirit_beast_sect:
    enabled: true
    note: 灵兽宗改词条类型（PET-D06）；费用见 pet_sect_reroll
  sect_hall:
    enabled: true
    note: 宗门大厅：拜入 / 自建 / 摘要
  sect_shop:
    enabled: true
    note: 宗门贡献商店（兼容旧接口）
  sect_tasks:
    enabled: true
    note: 宗门任务（含化身独立接交 · M4-D06）
  quest_hall:
    enabled: true
    note: 任务殿：接取与完成宗门任务
  council_hall:
    enabled: true
    note: 议事厅：人事 / 公告 / 俸禄 / 战入口占位
  treasure_pavilion:
    enabled: true
    note: 藏宝阁：贡献兑换与分配
  scripture_pavilion:
    enabled: true
    note: 藏经阁：功法兑换与上供
  forge_workshop:
    enabled: true
    note: 锻造工坊：贡献聘工匠代锻；可上缴/兑换图纸
  alchemy_workshop:
    enabled: true
    note: 炼丹阁：贡献聘丹师代炼；可上缴/兑换丹方
  talisman_workshop:
    enabled: true
    note: 服务工坊：符箓与傀儡代工；可上缴/兑换图纸
  formation_array:
    enabled: true
    note: 宗门大阵：阵法启停与上供
  spirit_mine:
    enabled: true
    note: 矿脉：产出宗门灵石
  herb_garden:
    enabled: true
    note: 灵药园：基础灵植与代种植

# 建宗费用（灵石）；有钱即可，无修为门槛（D2）
create_cost_spirit_stones: 100000

# 相对散修的入宗挂机修为乘区占位（显性展示，§0.7）
idle_bonus_vs_wanderer: 1.05

# 轮回时本宗贡献是否归零（D4）
contribution_zero_on_reincarnation: true

# 宗门名 / 箴言长度上限
max_name_len: 12
max_motto_len: 48
max_announcement_len: 200

# 贡献晋升自申：申请后隔多少个游戏日自动通过（1=次日）
promotion_auto_approve_after_game_days: 1

# 设施升级基础贡献费用（level→下一档）占位
facility_upgrade_cost_base: 80
facility_upgrade_cost_per_level: 40

# 宗门等级升级基础灵石（宗门库）占位
grade_upgrade_spirit_stones_base: 5000

# 祖师大境界 → 已解锁功能键（宗主≠祖师；功能读祖师进度 D3）
features_by_founder_realm:
  body_tempering: [shop_basic, quests_basic]
  qi_refining: [shop_basic, quests_basic]
  foundation: [shop_basic, quests_basic]
  jindan: [shop_basic, quests_basic, pet_exchange]
  yuanying: [shop_basic, quests_basic, pet_exchange]
  huashen: [shop_basic, quests_basic, pet_exchange]
  lianxu: [shop_basic, quests_basic, pet_exchange, secret_realm_hook]
  heti: [shop_basic, quests_basic, pet_exchange, secret_realm_hook]
  dacheng: [shop_basic, quests_basic, pet_exchange, secret_realm_hook]
  true_immortal: [shop_basic, quests_basic, pet_exchange, secret_realm_hook]

# ---------------------------------------------------------------------------
