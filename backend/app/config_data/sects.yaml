    label_zh: 杂役弟子
    order: 1
    contrib_required: 0
    self_apply: false
    appoint_by: []
    unique: false
    treasury_page_max: 0
    salary_contribution: 5
    council_actions: [salary, war_join]
  outer_disciple:
    label_zh: 外门弟子
    order: 2
    contrib_required: 50
    self_apply: true
    appoint_by: []
    unique: false
    treasury_page_max: 0
    salary_contribution: 10
    council_actions: [salary, war_join, self_recommend]
  inner_disciple:
    label_zh: 内门弟子
    order: 3
    contrib_required: 150
    self_apply: true
    appoint_by: []
    unique: false
    treasury_page_max: 0
    salary_contribution: 20
    council_actions: [salary, war_join, self_recommend]
  core_disciple:
    label_zh: 亲传弟子
    order: 4
    contrib_required: 300
    self_apply: true
    appoint_by: []
    unique: false
    treasury_page_max: 0
    salary_contribution: 35
    council_actions: [salary, war_join, self_recommend]
  outer_deacon:
    label_zh: 外门执事
    order: 5
    contrib_required: 500
    self_apply: true
    appoint_by: []
    unique: false
    treasury_page_max: 0
    salary_contribution: 50
    council_actions: [salary, war_join, self_recommend]
  outer_elder:
    label_zh: 外门长老
    order: 6
    contrib_required: 800
    self_apply: true
    appoint_by: []
    unique: false
    treasury_page_max: 1
    salary_contribution: 80
    council_actions: [salary, war_join, self_recommend]
  inner_deacon:
    label_zh: 内门执事
    order: 7
    contrib_required: 0
    self_apply: true
    appoint_by: [leader, grand_elder, supreme_elder, founder]
    unique: false
    treasury_page_max: 2
    salary_contribution: 100
    council_actions: [salary, war_join, self_recommend]
  inner_elder:
    label_zh: 内门长老
    order: 8
    contrib_required: 0
    self_apply: true
    appoint_by: [leader, grand_elder, supreme_elder, founder]
    unique: false
    treasury_page_max: 3
    salary_contribution: 130
    council_actions: [salary, war_join, self_recommend]
  leader:
    label_zh: 掌门
    order: 9
    contrib_required: 0
    self_apply: false
    appoint_by: [supreme_elder, founder]
    unique: true
    treasury_page_max: 5
    salary_contribution: 200
    council_actions:
      - salary
      - war_join
      - war_start
      - announce
      - upgrade_facility
      - upgrade_grade
      - toggle_buff
      - appoint
  grand_elder:
    label_zh: 大长老
    order: 10
    contrib_required: 0
    self_apply: false
    appoint_by: [supreme_elder, founder]
    unique: false
    # 大长老修为须高于掌门（服务端校验）
    require_cultivation_above_leader: true
    treasury_page_max: 4
    salary_contribution: 180
    council_actions:
      - salary
      - war_join
      - appoint
  supreme_elder:
    label_zh: 太上长老
    order: 11
    contrib_required: 0
    self_apply: false
    appoint_by: [founder]
    unique: false
    treasury_page_max: 6
    salary_contribution: 250
    council_actions:
