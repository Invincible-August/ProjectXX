      - war_join
      - war_start
      - announce
      - upgrade_facility
      - upgrade_grade
      - toggle_buff
      - appoint
  founder:
    label_zh: 创派祖师
    order: 12
    contrib_required: 0
    self_apply: false
    appoint_by: []
    unique: true
    treasury_page_max: 99
    salary_contribution: 300
    council_actions:
      - salary
      - war_join
      - war_start
      - announce
      - upgrade_facility
      - upgrade_grade
      - toggle_buff
