    label_zh: 攻击
  defense:
    label_zh: 防御
  resistance:
    label_zh: 抗性

# 矿脉：被动入宗门库 + 采矿挂机（无名额日领）
mine_yield:
  # 被动：每小时基础入宗门库
  base_pool_per_hour: 60
  per_grade_order: 25
  per_facility_level: 20
  # 每位采矿弟子额外提升被动速率（比例）
  miner_pool_bonus_pct: 0.12
  # 采矿名额
  max_miners_base: 2
  max_miners_per_facility_level: 1
  max_miners_per_grade_order: 1
  # 采矿挂机（与 idle tick 对齐）
  tick_seconds: 60
  personal_stones_per_tick: 5
  stamina_per_tick: 2
  note_zh: 自点击开始起每满 tick_seconds（默认60s）结算一次：个人灵石（受时辰/天气/通道加成）与战斗体力同步扣发；开始后第一段等待不扣体力；宗门库亦按自锚点满段入账

