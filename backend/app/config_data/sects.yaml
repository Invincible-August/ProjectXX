  famous_sect:
    label_zh: 名宗
    order: 4
    max_members: 120
    max_active_buffs: 2
    facility_level_cap: 5
    idle_bonus: 1.16
    buff_tier_cap: 2
    upgrade_require_facilities:
      forge_workshop: 3
      alchemy_workshop: 3
      spirit_mine: 2
  superior_sect:
    label_zh: 上宗
    order: 5
    max_members: 180
    max_active_buffs: 3
    facility_level_cap: 6
    idle_bonus: 1.20
    buff_tier_cap: 3
    upgrade_require_facilities:
      talisman_workshop: 3
