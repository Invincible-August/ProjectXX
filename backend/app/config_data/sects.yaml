      # 托管种植费用与周期
      plant_cost_contribution: 15
      grow_game_days: 1
      yield_item_id: basic_spirit_herb
      yield_qty: 2
    mist_lotus:
      label_zh: 雾莲种
      summary: 稍贵的灵植样本
      exchange_cost_contribution: 45
