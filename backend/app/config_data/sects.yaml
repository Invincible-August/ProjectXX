  immortal_gate:
    label_zh: 仙门
    order: 6
    max_members: 250
    max_active_buffs: 3
    facility_level_cap: 7
    idle_bonus: 1.25
    buff_tier_cap: 3
    upgrade_require_facilities:
      council_hall: 5
      treasure_pavilion: 5
      scripture_pavilion: 5
  sacred_land:
    label_zh: 圣地
    order: 7
    max_members: 350
    max_active_buffs: 4
    facility_level_cap: 8
    idle_bonus: 1.30
    buff_tier_cap: 4
    upgrade_require_facilities:
      formation_array: 6
      spirit_mine: 5
      herb_garden: 5
  heaven_sect:
    label_zh: 天宗
    order: 8
    max_members: 500
    max_active_buffs: 4
    facility_level_cap: 9
    idle_bonus: 1.35
    buff_tier_cap: 4
    upgrade_require_facilities:
      quest_hall: 7
      forge_workshop: 7
      alchemy_workshop: 7
  dao_court:
    label_zh: 道庭
    order: 9
    max_members: 800
    max_active_buffs: 5
    facility_level_cap: 10
    idle_bonus: 1.40
    buff_tier_cap: 5
    upgrade_require_facilities:
      council_hall: 8
      formation_array: 8
      treasure_pavilion: 8

# ---------------------------------------------------------------------------
# 弟子职位（低→高）
# contrib_required：贡献自升/自荐门槛；self_apply=true 表示可议事厅自申次日过
# appoint_by：可任命本职的职位键列表；unique：全宗唯一
# treasury_page_max：可分配藏宝阁页码上限（0=不可分配）
# ---------------------------------------------------------------------------
disciple_ranks:
