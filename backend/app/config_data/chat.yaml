# =====================================================================
# 用途：聊天五频道（M7 L4）
# 后台域：chat（content / balance 限速）
# =====================================================================

# 历史保留条数（非私聊频道拉历史封顶；服务端仍落库）
history_limit: 100
# 私聊每会话（channel_ref）服务端只保留最近 N 条；ADM 可改；与 session_ephemeral 解耦（私聊持久）
dm_history_limit: 100
# 会话级清空：退出登录 / 关闭浏览器后客户端清空「非私聊」展示；本会话仅见进房后新消息（不拉历史）
# 私聊不受此限：前端弹窗始终拉 history
session_ephemeral: true
# 单条正文最大字数
max_body_len: 200
# 发言限速：滑动窗口秒 / 窗口内最多条
rate_window_sec: 10
rate_max_messages: 5
# 敏感词占位（命中替换为 *）
sensitive_words:
  - 违禁词样例
# 是否启用敏感词过滤
sensitive_filter_enabled: true
# 世界频道分线占位键
world_line_id: default
# 私聊是否要求道友（false=任意双方会话）
dm_require_friend: false
# 组队邀请是否要求社交关系（道友 / 同门 / 师徒）
party_require_friend: true
# 组队邀请过期秒数（0=不过期；读时惰性过期；默认 60=1 分钟）
party_invite_expire_sec: 60
# 普通队伍人数上限（超出须转换为团队）
party_max_members: 5
# 团队人数上限
team_max_members: 40
# 仅 development：无 WS 时假定双方在线（经 PresenceService 读取）
# 名单展示一律用真实 Presence，不受本开关影响；本开关仅影响邀请 HTTP 门闸
party_dev_assume_online: false
# 频道中文名（玩家可见）
labels_zh:
  world: 世界
  sect: 宗门
  dm: 私聊
  mentor: 师承
  party: 队伍
  team: 团队