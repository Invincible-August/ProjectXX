# =====================================================================
# 用途：制造业全局参数与四类配方（炼丹/炼器/制符/傀儡；阵法不进工坊）
# 加载时机：M4 工坊排队、结算、领取；环境 weather craft 乘区可叠加
# =====================================================================

# 本体制造向挂机时对工坊效率的加成乘区
main_crafting_bonus: 1.25
# 同一角色同时进行的工坊任务上限（已废弃：顺序排队不设上限；保留键兼容后台/旧客户端）
max_jobs_per_actor: 99

# 领取品质：按 (制作者等级 - required_craft_level) 取最高已达档
# 高等级制造低门槛已学图纸时，高品质权重大幅提高
quality_by_level_delta:
  - min_delta: 0
    weights: { common: 80, fine: 18, rare: 2 }
  - min_delta: 1
    weights: { common: 45, fine: 40, rare: 15 }
  - min_delta: 3
    weights: { common: 15, fine: 45, rare: 35, superb: 5 }
  - min_delta: 5
    weights: { common: 4, fine: 26, rare: 50, superb: 20 }

# 配方表；后续配方字段同第一条
# branch / name / duration_seconds / fail_chance / spirit_stone_cost / stamina_cost
# required_craft_level  对应分支制作等级门槛
# recipe_tier           图纸品阶（展示；学习完式仍 M8-D06）
# grant_craft_level     领取成功时该分支等级 +N
