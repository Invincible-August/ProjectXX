# =====================================================================
# 用途：体力上限、惰性恢复速率、开战/制作消耗
# 加载时机：M3 开战前校验扣减；M4 工坊可引用 craft 消耗；STAMINA_ENABLED 可关门禁
# =====================================================================

# 体力上限（cap_by_major_realm 扩展后置）
cap: 120

# 每分钟恢复点数（0.5 ≈ 每 2 分钟 1 点；一天约 720 点，天然构成日上限）
regen_per_minute: 0.5

# 各类行为的体力消耗
costs:
  battle_pve: 5           # PVE 开战
  battle_pvp: 8           # PVP 开战
  craft: 10               # M4+ 制作接口位，本期不消费

# 恢复道具是否允许溢出上限（道具本体依赖 M3-D05，本期仅留规则位）
item_overflow: false
