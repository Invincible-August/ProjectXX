# =====================================================================
# 用途：道友关系（M7 L2）
# 后台域：friends（content）
# =====================================================================

max_friends: 50
# 申请过期秒数（0=不过期；读时惰性清理）
request_expire_sec: 604800
# 轮回是否保留道友关系（D5 默认保留）
keep_on_reincarnation: true
# 列表是否附带在线（接 WS Hub）
include_online: true
# 兼容旧键
include_online_stub: true
# 仅 development：无 WS 时假定在线，便于单测/本地
dev_assume_online: true
# 仅 development：助战邀请假定主人在线（须手动 accept）；缺省读 avatar.yaml
assist_dev_assume_online: false
