# =====================================================================
# 用途：统一战斗/生活属性注册表（ATTR-D01）
# 加载时机：build_combat_attrs / 角色面板 / ADM combat_attrs
# 纪律：M13 只改数字与系数，不改机读键名；公式未开键仅展示
# =====================================================================

schema_version: 2

defaults:
  speed: 10
  mp: 0
  phys_atk: 0
  phys_def: 0
  magic_atk: 0
  magic_def: 0
  hit: 0
  dodge: 0
  breath_efficiency: 1.0

# 旧键 → 新键（迁移期强制）
aliases:
  atk: phys_atk
  defense: phys_def
  base_atk: base_phys_atk

# 主键 → 战斗键映射系数（占位全 0，避免改现行战力数字；M13 填数）
primary_map:
  strength:
    phys_atk: 0.0
    phys_def: 0.0
  agility:
    speed: 0.0
    dodge: 0.0
    hit: 0.0
  intelligence:
    magic_atk: 0.0
    mp: 0.0
  comprehension: {}
  bone_root:
    hp: 0.0
    phys_def: 0.0

attrs:
  hp:
    label_zh: 生命
    help_zh: 棋盘最大生命；归零阵亡；大阵为阵眼耐久
    engine: true
    panel: true
    category: combat_core
    default: 1
  phys_atk:
    label_zh: 物理攻击
    help_zh: 物理普攻/武器威力底；旧键 atk 别名
    engine: true
    panel: true
    category: combat_core
    default: 0
  phys_def:
    label_zh: 物理防御
    help_zh: 减伤基底（公式未开时仅展示占位）
    engine: false
    panel: true
    formula_enabled: false
    category: combat_core
    default: 0
  magic_atk:
    label_zh: 法术攻击
    help_zh: 法术/神通威力底（公式未开时仅展示）
    engine: false
    panel: true
    formula_enabled: false
    category: combat_core
    default: 0
  magic_def:
    label_zh: 法术防御
    help_zh: 法术减伤基底（公式未开时仅展示）
    engine: false
    panel: true
    formula_enabled: false
    category: combat_core
    default: 0
  speed:
    label_zh: 速度
    help_zh: 先攻排序底；与骰子结合
    engine: true
    panel: true
    category: combat_core
    default: 10
  mp:
    label_zh: 法力
    help_zh: 施法资源；无技能时可显示 0
    engine: true
    panel: true
    category: combat_core
    default: 0
  hit:
    label_zh: 命中
    help_zh: 命中公式开后启用
    engine: false
    panel: true
    formula_enabled: false
    category: combat_core
    default: 0
  dodge:
    label_zh: 闪避
    help_zh: 闪避公式开后启用
    engine: false
    panel: true
    formula_enabled: false
