# =====================================================================
# 用途：离线挂机收益时长帽、会员档位、领取 pending 阈值
# 加载时机：M2 离线结算 / 预览 / 领取；可被 OFFLINE_* 环境变量覆盖部分项
# =====================================================================

# 免费玩家默认离线有效小时数（墙钟帽）
free_cap_hours: 12

# 会员档位对应的离线帽（小时）；键=会员档 id
membership_caps:
  free: 12
  tier1: 18
  tier2: 24

# 离线时长达到该秒数才出现「可领取 pending」预览门槛
preview_threshold_seconds: 300

# 领取后是否把「帽外墙钟」直接丢弃（推进锚点到 now）
discard_over_cap_wall_time: true
