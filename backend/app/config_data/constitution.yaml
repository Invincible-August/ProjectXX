# =====================================================================
# 用途：体质槽默认、创角样本；同一体质本源/旁支两套效果
# 加载时机：创角发放收藏；镶嵌影响突破权重与战斗加成
# =====================================================================

# 默认栏位：1 本源 + 2 旁支；更多栏位用轮回点购买（软顶见 reincarnation.yaml）
slot_defaults:
  main: 1                 # 本源槽（始终 1）
  sub: 2                  # 初始旁支槽
  soft_cap: 7             # 软上限（提示用，不是硬拒）

items:
  # 收集到的体质均可装本源或旁支；main_effects / sub_effects 按槽生效
  sample_body_root:
    name: 凡体·根基
    kind: physique
    quality: mortal
    base_attrs:
      vitality: 5
      defense: 3
    main_effects:
      hp_bonus: 8
    sub_effects:
      atk_bonus: 2
  sample_main_affix_iron:
    name: 铜皮凡体
    kind: physique
    quality: mortal
    grade: good
    main_effects:
      hp_bonus: 20
      # idle_mult: 1.1    # 可选：挂机速率钩子（体质通道 constitution_idle）
    sub_effects:
      atk_bonus: 4
  sample_sub_affix_swift:
    name: 轻身凡体
    kind: physique
    quality: mortal
    grade: mortal
    main_effects:
      atk_bonus: 6
    sub_effects:
      atk_bonus: 2
  accept_main_affix_keep:
    name: 验收·留命体
    kind: physique
    grade: good
    main_effects:
      hp_bonus: 30
    sub_effects:
      hp_bonus: 10
  accept_sub_affix_keep:
    name: 验收·固本体
    kind: physique
    grade: mortal
    main_effects:
      atk_bonus: 8
    sub_effects:
      atk_bonus: 5
