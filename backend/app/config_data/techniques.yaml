# =====================================================================
# 用途：功法目录（名称、轨道、升级消耗、环境标签）
# 加载时机：M2 功法/创角默认解锁；M5 挂机时辰×天气 tag 乘区读取 env_tags
# =====================================================================

# 功法表：键=technique_id；后续条目字段含义同第一条
techniques:
  # —— 字段说明（以下条目共用）——
  # name              展示名
  # track             轨道：spirit=灵修 / body=体修 / crafting=制造
  # max_level         最大等级
  # env_tags          参与 calendar/weather tag_modifiers 的标签列表
  # cost_per_level    每级升级消耗（灵石等，按下标 0=升到 1 级）
  # dice_mods         按等级的骰子上下限修正（下标 0=1 级）；见 骰子系统设计.md
  basic_qi_art:
    name: 基础吐纳诀
    track: spirit
    max_level: 10
    env_tags: [common_art]
    # reincarnatable=可轮回带入（功法特性）
    traits: [reincarnatable]
    cost_per_level: [20, 40, 80, 120, 200, 300, 450, 600, 800, 1000]
    effects_placeholder:
      atk_bonus_per_level: 1      # 每级攻击加成占位
    # 占位：高等级略抬骰子下限/上限
    dice_mods:
      - { min_bonus: 0, max_bonus: 0 }
      - { min_bonus: 0, max_bonus: 0 }
      - { min_bonus: 0, max_bonus: 1 }
      - { min_bonus: 0, max_bonus: 1 }
      - { min_bonus: 1, max_bonus: 1 }
      - { min_bonus: 1, max_bonus: 1 }
      - { min_bonus: 1, max_bonus: 2 }
      - { min_bonus: 1, max_bonus: 2 }
      - { min_bonus: 2, max_bonus: 2 }
      - { min_bonus: 2, max_bonus: 3 }
  # 以下功法字段同上
  iron_body_art:
    name: 铁皮锻体功
    track: body
    max_level: 10
    env_tags: [common_art]
    traits: [reincarnatable]
    cost_per_level: [20, 40, 80, 120, 200, 300, 450, 600, 800, 1000]
    effects_placeholder:
      hp_bonus_per_level: 5       # 每级生命加成占位
    dice_mods:
      - { min_bonus: 0, max_bonus: 0 }
      - { min_bonus: 0, max_bonus: 1 }
      - { min_bonus: 0, max_bonus: 1 }
      - { min_bonus: 1, max_bonus: 1 }
      - { min_bonus: 1, max_bonus: 2 }
      - { min_bonus: 1, max_bonus: 2 }
      - { min_bonus: 2, max_bonus: 2 }
      - { min_bonus: 2, max_bonus: 3 }
      - { min_bonus: 2, max_bonus: 3 }
      - { min_bonus: 3, max_bonus: 3 }
  beginner_alchemy:
    name: 入门丹道残篇
    track: crafting
    max_level: 5
    env_tags: [water_art]
    cost_per_level: [30, 60, 100, 160, 250]
    effects_placeholder:
      crafting_speed_bonus_per_level: 0.02  # 每级制造速度加成（比例）
  # 样本：雷法残篇 —— 雷暴时修炼额外吃 tag 乘区（联调用）
  thunder_breath_art:
    name: 雷息吐纳残篇
    track: spirit
    max_level: 5
    env_tags: [thunder_art]
    cost_per_level: [40, 80, 120, 200, 300]
    effects_placeholder:
      atk_bonus_per_level: 2
    dice_mods:
      - { min_bonus: 0, max_bonus: 1 }
      - { min_bonus: 1, max_bonus: 1 }
      - { min_bonus: 1, max_bonus: 2 }
      - { min_bonus: 1, max_bonus: 2 }
      - { min_bonus: 2, max_bonus: 2 }