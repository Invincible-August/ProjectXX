# =====================================================================
# 用途：自研材料、词条池、重投与门槛（M8 R2 功法；R3 阵法；符 R4 扩展）
# 加载时机：ResearchService 会话 / 定稿校验
# =====================================================================

schema_version: 1
reincarnation_carry: false

technique:
  label_zh: 自研功法
  help_zh: 投入材料与修为，掷骰预览词条后定稿为仅自己可用的残篇。
  allowed_materials:
    - herb_spirit_grass
    - ore_iron_raw
  min_materials: 1
  spend:
    cultivation_points: 20
    body_tempering_points: 0
  reroll:
    max_rerolls: 2
    extra_materials:
      - item_id: herb_spirit_grass
        quantity: 1
  affix_slots: 2
  extra_affix_roll: 12
  session_ttl_seconds: 86400
  track: spirit
  # 可修炼层数上限 10；下标 level 对应「当前层→下一层」消耗（1→2 用 [1] … 9→10 用 [9]）
  max_level: 10
  cost_per_level: [30, 60, 100, 160, 250, 400, 600, 800, 1000, 1200]
  perfection_cost: 1500

formation:
  label_zh: 自研阵法
  help_zh: 投入材料后在设计器画部署区与地形，定稿后可出战；蓝图冻结，再改须另开新研。
  allowed_materials:
    - herb_spirit_grass
    - ore_iron_raw
  min_materials: 1
  spend:
    cultivation_points: 10
    body_tempering_points: 0
  required_array_level: 0
  session_ttl_seconds: 86400
  default_deploy_mode: free_own
  terrain_layout:
    mode: brush
    brush:
      max_obstacles: 3
      max_ravines: 1
      allowed_types: [obstacle, ravine]
      paint_zone: own_half
  allowed_deploy_modes:
    - default
    - free_own
    - mask
  allowed_environment_ids: []
  allowed_weather_ids: []
  allowed_effect_ids: []
  max_force_shifts: 0

talisman:
  label_zh: 自研符箓
  help_zh: 选定白名单效果并定稿图纸，再去工坊画符；出战符箓在角色页装备栏上阵（无件数上限，同种类战斗中不叠加）。
  allowed_materials:
    - talisman_paper
    - herb_spirit_grass
  min_materials: 1
  spend:
    cultivation_points: 10
    body_tempering_points: 0
  session_ttl_seconds: 86400
  scribe:
    paper_item_id: talisman_paper
    paper_per_copy: 1
    max_batch: 20
  preload_slots: 0
  battle:
    enabled: true

affixes:
  phys_edge:
    label_zh: 锋锐
    help_zh: 占位：增加物理攻击
    stats:
      phys_atk: 2
  vitality_trace:
    label_zh: 体魄残痕
    help_zh: 占位：增加生命
    stats:
      hp: 8
  swift_breath:
    label_zh: 迅息
    help_zh: 占位：略增速度
    stats:
      speed: 1

# 功法卡片自研（P1）：空白卡→类型/正式卡→镶嵌草稿；数值均为占位，禁止在代码 if 分支写死。
technique_craft:
  help_zh: 于洞府储物开出属性/效能正式卡，点镶嵌格选卡入雏形，确认发动条件与词条后定稿可培养。
  # 自创定稿默认可经资源分配修炼层数（1→10→大圆满）；定稿前须推演五层/圆满奖励三选
  default_cultivable: true
  perfection_cost: 1500
  # 层数里程碑奖励测试库（milestone=tier5|perfection）；后台域 research 可改
  level_bonus_catalog:
    tb_atk_gray: { label_zh: 小攻残痕, milestone: tier5, rarity: gray, stats: { phys_atk: 1 } }
    tb_hp_white: { label_zh: 体魄微光, milestone: tier5, rarity: white, stats: { hp: 8 } }
    tb_def_green: { label_zh: 护体薄纱, milestone: tier5, rarity: green, stats: { phys_def: 2 } }
    tb_matk_blue: { label_zh: 法意初凝, milestone: tier5, rarity: blue, stats: { magic_atk: 2 } }
    pf_atk_white: { label_zh: 圆满锋刃, milestone: perfection, rarity: white, stats: { phys_atk: 3 } }
    pf_hp_green: { label_zh: 圆满体魄, milestone: perfection, rarity: green, stats: { hp: 20 } }
    pf_atk_blue: { label_zh: 圆满锋芒, milestone: perfection, rarity: blue, stats: { phys_atk: 4 } }
    pf_matk_purple: { label_zh: 圆满法芒, milestone: perfection, rarity: purple, stats: { magic_atk: 4 } }
  level_bonus_roll_weights: { gray: 10, white: 28, green: 26, blue: 24, purple: 8, orange: 3, red: 1 }
  blank_to_type_p_element: 0.5
  efficacy_weights:
    spell_attack: 1
    spell_buff: 1
    martial_attack: 1
    martial_buff: 1
    idle_spirit: 1
    idle_body: 1
  embed_fail_rate: 0.2
  affix_upgrade_fail_rate: 0.2
  breakthrough_fail_rate: 0.3
  base_bonus_points: [5, 10, 20]
  affix_upgrade_points: [5, 10, 20]
  spirit_upgrade_cost: [20, 40, 80, 160]
  body_upgrade_cost: [20, 40, 80, 160]
  # 词条升级消耗：下标=当前等级（0→1 用 [0]，1→2 用 [1]…）；超出表长用末项；× 稀有度 cost_mult
  # 后台域 research → technique_craft.affix_upgrade_cost / affix_rarities.*.cost_mult 可改
  affix_upgrade_cost: [15, 30, 60, 120, 200, 320, 480, 720]
  affix_reroll_cost: [10, 20, 40, 80]
  breakthrough_cost_cultivation: 50
  breakthrough_cost_body: 50
  print_manual_cost_cultivation: 500
  print_manual_cost_body: 500
  affix_level_mult: 0.2
  # 突破成功后，每个「已有」词条额外叠一层数值（新开空位不叠）；与稀有度 upgrade_mult 无关
  breakthrough_affix_bonus: 0.15
  base_stat_per_click: 1
  # 各阶 base_upgrade_cap = 进入/处于该功法阶时「本阶新增」的基础加成次数（累加，非累计总上限）
  # 例：锻体 3、炼气再 +4 → 炼气阶共 7；创建境界额外见 base_upgrade_create_bonus_per_rank
  # affix_slots：创建时按人物境界取栏数；突破时若功法阶栏数更高则补空位
  ranks:
    body_tempering:
      affix_slots: 1
      base_upgrade_cap: 3
      upgrade_points_required: 10
    qi_refining:
      affix_slots: 2
      base_upgrade_cap: 4
      upgrade_points_required: 100
    foundation:
      affix_slots: 2
      base_upgrade_cap: 4
      upgrade_points_required: 200
    jindan:
      affix_slots: 3
      base_upgrade_cap: 5
      upgrade_points_required: 350
    yuanying:
      affix_slots: 3
      base_upgrade_cap: 5
      upgrade_points_required: 500
    huashen:
      affix_slots: 4
      base_upgrade_cap: 6
      upgrade_points_required: 800
    true_immortal:
      affix_slots: 4
      base_upgrade_cap: 6
      upgrade_points_required: 1200
  # 创建时人物境界 → 之后每达成一功法阶额外多给几次基础加成（后台域 research 可改）
  # 法修（法术/修为修炼）读 major_realm；体修（武技/炼体修炼）读炼体大境对照的 unlock_major，勿混用
  base_upgrade_create_bonus_per_rank:
    body_tempering: 0
    qi_refining: 1
    foundation: 1
    jindan: 2
    yuanying: 2
    huashen: 3
    true_immortal: 4
  weapon_bonus:
    sword: { phys_atk: 2 }
    saber: { phys_atk: 2 }
    spear: { phys_atk: 2 }
    gauntlet: { phys_atk: 2 }
    bow: { phys_atk: 2 }
    puppet: { phys_atk: 2 }
    avatar: { magic_atk: 2 }
  # 属性限制加成：栏位预留，后续后台可配；当前为空
  element_bonus: {}
  # 词条稀有度：权重控制三选出现率；base/upgrade/cost_mult 控初始值、升级加成、升级消耗
  # label_zh：粗糙→太古（前端芯片不写品阶字，只靠颜色；悬停/详情徽章用此文案）
  # 后台域 research 可改（口子已留）
