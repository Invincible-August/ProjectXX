# =====================================================================
# 用途：自研材料、词条池、重投与门槛（M8 R2 功法；R3 阵法；符 R4 扩展）
# 加载时机：ResearchService 会话 / 定稿校验
# =====================================================================

schema_version: 1
reincarnation_carry: false

technique:
  label_zh: 自研功法
  help_zh: 投入材料与修为，掷骰预览词条后定稿为仅自己可用的残篇。
  allowed_materials:
    - herb_spirit_grass
    - ore_iron_raw
  min_materials: 1
  spend:
    cultivation_points: 20
    body_tempering_points: 0
  reroll:
    max_rerolls: 2
    extra_materials:
      - item_id: herb_spirit_grass
        quantity: 1
  affix_slots: 2
  extra_affix_roll: 12
  session_ttl_seconds: 86400
  track: spirit
  max_level: 5
  cost_per_level: [30, 60, 100, 160, 250]

formation:
  label_zh: 自研阵法
  help_zh: 投入材料后在设计器画部署区与地形，定稿后可出战；蓝图冻结，再改须另开新研。
  allowed_materials:
    - herb_spirit_grass
    - ore_iron_raw
  min_materials: 1
  spend:
    cultivation_points: 10
    body_tempering_points: 0
  required_array_level: 0
  session_ttl_seconds: 86400
  default_deploy_mode: free_own
  terrain_layout:
    mode: brush
    brush:
      max_obstacles: 3
      max_ravines: 1
      allowed_types: [obstacle, ravine]
      paint_zone: own_half
  allowed_deploy_modes:
    - default
    - free_own
    - mask
  allowed_environment_ids: []
  allowed_weather_ids: []
  allowed_effect_ids: []
  max_force_shifts: 0

talisman:
  label_zh: 自研符箓
  help_zh: 选定白名单效果并定稿图纸，再去工坊画符；出战符箓在角色页装备栏上阵（无件数上限，同种类战斗中不叠加）。
  allowed_materials:
    - talisman_paper
    - herb_spirit_grass
  min_materials: 1
  spend:
    cultivation_points: 10
    body_tempering_points: 0
  session_ttl_seconds: 86400
  scribe:
    paper_item_id: talisman_paper
    paper_per_copy: 1
    max_batch: 20
  preload_slots: 0
  battle:
    enabled: true

affixes:
  phys_edge:
    label_zh: 锋锐
    help_zh: 占位：增加物理攻击
    stats:
      phys_atk: 2
  vitality_trace:
    label_zh: 体魄残痕
    help_zh: 占位：增加生命
    stats:
      hp: 8
  swift_breath:
    label_zh: 迅息
    help_zh: 占位：略增速度
    stats:
      speed: 1

# 功法卡片自研（P1）：空白卡→类型/正式卡→镶嵌草稿；数值均为占位，禁止在代码 if 分支写死。
technique_craft:
  help_zh: 用空白卡生成属性/效能正式卡，镶入草稿后选发动条件与词条，定稿后可培养。
  blank_to_type_p_element: 0.5
  efficacy_weights:
    spell_attack: 1
    spell_buff: 1
    martial_attack: 1
    martial_buff: 1
    idle_spirit: 1
    idle_body: 1
  embed_fail_rate: 0.2
  affix_upgrade_fail_rate: 0.2
  breakthrough_fail_rate: 0.3
  base_bonus_points: [5, 10, 20]
  affix_upgrade_points: [5, 10, 20]
  spirit_upgrade_cost: [20, 40, 80, 160]
  body_upgrade_cost: [20, 40, 80, 160]
  affix_upgrade_cost: [15, 30, 60, 120]
  affix_reroll_cost: [10, 20, 40, 80]
  breakthrough_cost_cultivation: 50
  breakthrough_cost_body: 50
  affix_level_mult: 0.2
  base_stat_per_click: 1
  ranks:
    body_tempering:
      affix_slots: 1
      base_upgrade_cap: 3
      upgrade_points_required: 10
    qi_refining:
      affix_slots: 2
      base_upgrade_cap: 6
      upgrade_points_required: 100
  weapon_bonus:
    sword: { phys_atk: 2 }
    saber: { phys_atk: 2 }
    spear: { phys_atk: 2 }
    gauntlet: { phys_atk: 2 }
    bow: { phys_atk: 2 }
    puppet: { phys_atk: 2 }
    avatar: { magic_atk: 2 }
  affixes:
    sa_edge:
      label_zh: 法锋
      efficacy_allow: [spell_attack]
      role: attack
      stats: { magic_atk: 3 }
    sb_ward:
      label_zh: 法盾
      efficacy_allow: [spell_buff]
      role: buff
      stats: { magic_def: 3 }
    ma_edge:
      label_zh: 武锋
      efficacy_allow: [martial_attack]
      role: attack
      stats: { phys_atk: 3 }
    mb_ward:
      label_zh: 武御
      efficacy_allow: [martial_buff]
      role: buff
      stats: { phys_def: 3 }
    is_flow:
      label_zh: 周天
      efficacy_allow: [idle_spirit]
      role: idle
      stats: { magic_atk: 1 }
    ib_bone:
      label_zh: 锻骨
      efficacy_allow: [idle_body]
      role: idle
      stats: { phys_atk: 1 }
