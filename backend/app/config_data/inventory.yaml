    tradable: true
    bound: false
    use_effect:
      kind: stamina           # 恢复体力
      amount: 20              # 恢复点数
    inspect:
      element: wood
      realm_req_zh: 无
      effects: [恢复体力]
      help_zh: 服下后恢复体力。同属性灵根额外收益尚未结算，本版只展示属性。
  bound_spirit_token:
