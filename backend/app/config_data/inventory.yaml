      effects: [材料]
      help_zh: 炼器成品。同属性灵根额外收益尚未结算，本版只展示属性。
  talisman_atk_t1:
    name: 一级攻符
    item_type: talisman
    max_stack: 20
    bag_allowed: [normal, reincarnation]
    inspect:
      element: fire
