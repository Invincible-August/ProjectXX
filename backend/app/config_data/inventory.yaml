# =====================================================================
# 用途：背包堆叠规则、物品类型枚举、物品目录（材料/消耗品等）
# 加载时机：M4 背包与工坊材料校验、道具使用效果
# 交易/机缘字段：tradable（默认 true）/ bound（默认 false）/ unique（默认 false，唯一物不可发机缘）
# =====================================================================

# 堆叠上限规则
stack_rules:
  default_max_stack: 99           # 未单独指定时的默认堆叠上限
  by_item_type:                   # 按物品类型覆盖默认
    consumable: 99
    material: 999
    talisman: 20
    puppet: 1
    skill_book: 20
    pet_egg: 20
    equipment: 1
    manual: 20
    pet: 1

# 系统识别的物品类型枚举
item_types:
  - consumable
  - material
  - talisman
  - puppet
  - skill_book
  - pet_egg
  - equipment
  - manual
  - pet

# 物品目录；后续条目字段同首条（消耗品可多 use_effect）
items:
  # —— 字段说明 ——
  # name         展示名
  # item_type    类型（须在 item_types 内）
  # max_stack    堆叠上限
  # bag_allowed  可放入的袋：normal / reincarnation；缺省仅 normal
  # use_effect   （可选）使用效果：kind=效果类，amount=数值
  # inspect      （可选）悬停：element 单一属性（金木水火土风雷暗）、effects、realm_req_zh、help_zh
  herb_spirit_grass:
    name: 灵草
    item_type: material
    max_stack: 999
    bag_allowed: [normal, reincarnation]
  # 以下材料字段同上
  ore_iron_raw:
    name: 粗铁矿
    item_type: material
    max_stack: 999
    bag_allowed: [normal]
  talisman_paper:
    name: 符纸
    item_type: material
    max_stack: 999
    bag_allowed: [normal, reincarnation]
  array_fragment:
    name: 阵法残片
    item_type: material
    max_stack: 99
    bag_allowed: [normal, reincarnation]
  wood_spirit:
    name: 灵木
    item_type: material
    max_stack: 999
    bag_allowed: [normal]
  stamina_pill_minor:
    name: 小体力丹
