# =====================================================================
# 用途：交易行 / 拍卖 / 面交（M7 L2）
# 后台域：trade（balance）
# =====================================================================

# 交易行一口价：卖方所得扣百分比手续费 → 系统回收
listing_fee_pct: 0.05
# 以物易物：按上架者大境界档收固定灵石手续费（高于常规）
barter_fee_by_realm:
  body_tempering: 50
  qi_refining: 80
  foundation: 120
  jindan: 200
  yuanying: 350
  huashen: 500
  true_immortal: 800
barter_fee_default: 100

# 拍卖
auction_duration_sec: 3600
auction_min_increment_pct: 0.05
auction_fee_pct: 0.05
# 结拍失败（流拍）退回：inventory=直回背包；mail=系统邮件（L3 默认）
auction_unsold_refund: mail

# 面交
face_timeout_sec: 120
# 面交单次两侧物品行数上限
face_max_item_lines: 8
# 发起面交须为道友
face_require_friend: true
# 发起面交须双方在线（WsHub）
face_require_online: true
# 仅 development：跳过 WsHub 在线检查（单测/本地无 WS 时）
face_dev_assume_online: true

# 系统回收账户展示名（流水 character_id 为空）
recycle_label_zh: 天道回收池

# ---------------------------------------------------------------------
# 真正坊市（NPC 固定货架）：玩家用灵石购买；亦可按收购价出售给坊市
# ---------------------------------------------------------------------
bazaar:
  label_zh: 坊市
  hint_zh: 固定货架售卖常见材料与消耗品；玩家可将可回收道具按收购价换灵石。
  max_qty_per_deal: 99
  # item_id → 买价 / 卖价（卖价缺省=买价×sell_ratio_default）
  sell_ratio_default: 0.4
  items:
    herb_spirit_grass:
      label_zh: 灵草
      buy_price: 30
      sell_price: 12
    ore_iron_raw:
      label_zh: 粗铁矿
      buy_price: 25
      sell_price: 10
    talisman_paper:
      label_zh: 符纸
      buy_price: 40
      sell_price: 16
    wood_spirit:
      label_zh: 灵木
      buy_price: 35
      sell_price: 14
    stamina_pill_minor:
      label_zh: 小体力丹
      buy_price: 80
      sell_price: 30
    pet_food_basic:
      label_zh: 灵宠口粮
      buy_price: 50
      sell_price: 20
    array_fragment:
      label_zh: 阵法残片
      buy_price: 120
      sell_price: 48
